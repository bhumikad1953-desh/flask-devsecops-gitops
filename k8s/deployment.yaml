apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devsecops-app
  labels:
    app: flask-devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-devsecops-app
  template:
    metadata:
      labels:
        app: flask-devsecops-app
    spec:
      containers:
      - name: flask-devsecops-app
        image: bhumikadesh/flask-devsecops-app:v6
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
